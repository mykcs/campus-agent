name: Campus Agent core checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime
        run: node --version
      - name: JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/taskboard-core.js
          node --check public/taskboard.js
          node --check api/chat.js
          node --check public/agent/reader.js
      - name: Deterministic date, ICS and reader tests
        run: node --test tests/taskboard-core.test.cjs tests/agent-reader.test.cjs
      - name: Validate Vercel JSON
        run: python3 -m json.tool vercel.json >/dev/null
